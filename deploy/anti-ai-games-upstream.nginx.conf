# Install in nginx's http context (for example /etc/nginx/conf.d/).
map $http_upgrade $antiai_connection_upgrade {
    default upgrade;
    "" "";
}
upstream antiai_games_backend {
    least_conn;
    server 127.0.0.1:3001 max_fails=2 fail_timeout=5s;
    server 127.0.0.1:3006 max_fails=2 fail_timeout=5s;
    keepalive 32;
}
